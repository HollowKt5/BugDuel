function tone(freq,duration=.1,gain=.2,type='sine',end=freq){if(!sound.ctx)return;const c=sound.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(10,end),t+duration);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(sound.master);o.start(t);o.stop(t+duration+.03)}

<script>
// 先选定完整 CDN，再安装 import map；这样后期处理也使用同一份 Three.js。
(async()=>{
 const roots=['https://cdn.jsdelivr.net/npm/','https://unpkg.com/','https://fastly.jsdelivr.net/npm/'];
 for(let i=0;i<roots.length;i++){
  const root=roots[i],controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6500);
  try{
   paintBoot(`正在接通轨道 · 线路 ${i+1} / ${roots.length}`);
   const paths=['three@0.170.0/build/three.module.js','cannon-es@0.20.0/dist/cannon-es.js'];
   await Promise.all(paths.map(async path=>{const r=await fetch(root+path,{signal:controller.signal,cache:'force-cache'});if(!r.ok)throw new Error(`CDN HTTP ${r.status}`);await r.text()}));
   clearTimeout(timeout);
   const map=document.createElement('script');map.type='importmap';map.textContent=JSON.stringify({imports:{three:root+paths[0],'three/addons/':root+'three@0.170.0/examples/jsm/','cannon-es':root+paths[1]}});document.head.appendChild(map);
   const module=document.createElement('script');module.type='module';module.textContent=document.getElementById('game-source').textContent;document.body.appendChild(module);return;
  }catch(error){clearTimeout(timeout);controller.abort();console.warn('CDN unavailable:',root,error.message)}
 }
 paintBoot('无法连接 CDN · 请检查网络后刷新页面');
})();
</script>
